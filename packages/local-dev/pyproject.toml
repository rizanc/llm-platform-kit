[project]
name = "ai-eng-7-local-dev"
version = "0.1.0"
description = "Project #7 — Local-First AI Dev Environment (Ollama + LanceDB + FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "lancedb>=0.8",
    "pyarrow>=18",
    "ollama>=0.3",
    "pypdf>=5.0",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs docker compose up"]