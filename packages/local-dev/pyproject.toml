[project]
name = "localrag"
version = "0.1.0"
description = "Local-first RAG dev stack: Ollama + LanceDB + FastAPI in docker compose, zero API cost."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "lancedb>=0.8",
    "pyarrow>=18",
    "ollama>=0.3",
    "pypdf>=5.0",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localrag"]
