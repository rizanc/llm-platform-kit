[project]
name = "modelrouter"
version = "0.1.0"
description = "Cost-aware model router: routes each request to the cheapest capable tier and keeps a per-request spend log; LiteLLM-backed caller optional."
requires-python = ">=3.11"
license = "MIT"
dependencies = [

]

[project.optional-dependencies]
litellm = ["litellm>=1.50"]
prometheus = ["prometheus-client>=0.20"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modelrouter"]
