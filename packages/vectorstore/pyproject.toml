[project]
name = "vectorkit"
version = "0.1.0"
description = "Vector store layer: in-memory and Qdrant backends behind one interface, hybrid dense+sparse search, embedding cache, snapshot/restore."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.10"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vectorkit"]
