[project]
name = "citerag"
version = "0.1.0"
description = "RAG with page-level citations: SQLite FTS5 BM25 + cosine fused with RRF, reranking, and a grounding check on every answer."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "langgraph>=0.2",
    "pypdf>=5.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.3"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["citerag"]
