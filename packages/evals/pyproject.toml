[project]
name = "evalkit"
version = "0.1.0"
description = "Eval harness for LLM features: golden cases, deterministic and LLM-as-judge scorers, baseline regression gate for CI."
requires-python = ">=3.11"
license = "MIT"
dependencies = [

]

[project.optional-dependencies]
judge = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalkit"]
